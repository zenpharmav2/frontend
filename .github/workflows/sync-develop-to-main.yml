name: Sync develop to main

on:
  push:
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-develop-to-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Open pull request develop -> main (if needed)
        id: pr
        run: |
          set -euo pipefail

          # Skip if main already contains everything from develop
          ahead=$(gh api "repos/$GH_REPO/compare/main...develop" --jq '.ahead_by')
          if [ "$ahead" = "0" ]; then
            echo "main is already up to date with develop"
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          number=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh pr create --base main --head develop \
              --title "Sync develop to main" \
              --body "Automated sync of \`develop\` into \`main\` triggered by ${{ github.sha }}."
            number=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number')
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Merge pull request
        if: steps.pr.outputs.number != ''
        run: gh pr merge "${{ steps.pr.outputs.number }}" --merge
